# Blueprint de Render: web service + PostgreSQL (planes de paga acordados:
# el free se duerme con inactividad y su BD expira a los 30 días — mala idea
# para las 5 semanas del Mundial).
databases:
  - name: quiniela-db
    plan: basic-256mb
    databaseName: quiniela
    user: quiniela

services:
  - type: web
    name: quiniela-bienestar
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@11.2.2 --activate && pnpm install --frozen-lockfile --prod=false && pnpm build
    preDeployCommand: pnpm db:migrate && pnpm db:seed
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: quiniela-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SYNC_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false # pégala en el dashboard de Render
      - key: EMAIL_FROM
        sync: false # ej. "Quiniela del Bienestar <no-reply@tudominio.mx>"
      - key: ADMIN_EMAILS
        sync: false # ej. "gilberto.aspros@gmail.com"
      - key: FOOTBALL_DATA_TOKEN
        sync: false # opcional: habilita el sync automático
      - key: APP_URL
        sync: false # ej. "https://quiniela-bienestar.onrender.com"
